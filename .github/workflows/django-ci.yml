name: Django CI

on:
  push:
    branches: [ "main", "cicd/pasha" ]
  pull_request:
    branches: [ "main", "cicd/pasha" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: docker build -t tapsos-app .

    - name: Run Docker Container for Tests
      run: docker run tapsos-app python backend/TapSOS/manage.py test
